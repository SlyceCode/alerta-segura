# Solo para desarrollo local. Render no usa este archivo.
#   docker compose up --build
#   docker compose run --rm web pytest

name: alerta-segura

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: alerta
      POSTGRES_PASSWORD: alerta
      POSTGRES_DB: alerta
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alerta -d alerta"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: clave-local-no-usar-en-produccion
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://alerta:alerta@db:5432/alerta
      REDIS_URL: redis://redis:6379/0
      APP_ENV: local
      APP_COMMIT: local
    # En local interesa la recarga automatica, no gunicorn.
    entrypoint: ["/bin/bash", "-c"]
    command: >
      python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
    environment:
      MODO: worker
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: clave-local-no-usar-en-produccion
      DATABASE_URL: postgres://alerta:alerta@db:5432/alerta
      REDIS_URL: redis://redis:6379/0
      APP_ENV: local
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  datos_postgres:
